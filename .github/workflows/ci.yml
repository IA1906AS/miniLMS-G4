
name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: minilms
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mini_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minilms -d mini_lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://minilms:ci_only_password@127.0.0.1:5432/mini_lms_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app tests

      - name: Pytest and Coverage
        run: uv run python -m pytest --cov=app --cov-report=term-missing

      - name: Security audit
        run: uv run pip-audit
