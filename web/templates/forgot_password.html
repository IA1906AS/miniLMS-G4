
{% extends "base.html" %}

{% block content %}
<h2>Quên mật khẩu</h2>

<p>Nhập email bạn đã đăng ký.</p>
<!-- Flask CSRF is validated by check_csrf() in forgot_password -->
<!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -->
<form method="post">
    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <label>Email</label>
    <input type="email"
           name="email"
           required>

    <button type="submit" class="full">
        Yêu cầu đặt lại mật khẩu
    </button>
</form>

<p>
    <a href="{{ url_for('auth.login') }}">
        Quay lại đăng nhập
    </a>
</p>
{% endblock %}
