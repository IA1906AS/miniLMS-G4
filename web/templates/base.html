
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Mini LMS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        nav {
            background: #2563eb;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        nav strong {
            color: white;
            font-size: 24px;
        }

        nav form {
            display: inline;
        }

        .container {
            max-width: 480px;
            margin: 65px auto;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000010;
        }

        h2 {
            color: #2563eb;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 8px 0 17px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .full {
            width: 100%;
        }

        .message {
            padding: 12px;
            background: #eef2ff;
            border-radius: 8px;
            margin: 12px 0;
        }
    </style>
</head>

<body>

<nav>
    <strong>Mini LMS</strong>

    <div>
        <a href="{{ url_for('home') }}">Trang chủ</a>

        {% if g.user %}
            <a href="{{ url_for('auth.account') }}">
                Tài khoản
            </a>

            <form method="post"
                  action="{{ url_for('auth.logout') }}">
                <input type="hidden"
                       name="csrf_token"
                       value="{{ csrf_token() }}">
                <button type="submit">Đăng xuất</button>
            </form>
        {% else %}
            <a href="{{ url_for('auth.login') }}">
                Đăng nhập
            </a>

            <a href="{{ url_for('auth.register') }}">
                Đăng ký
            </a>
        {% endif %}
    </div>
</nav>

<main class="container">

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

</body>
</html>
