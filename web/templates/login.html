
{% extends "base.html" %}

{% block content %}

<style>
    .password-wrapper {
        position: relative;
        width: 100%;
    }

    .password-wrapper input {
        width: 100%;
        box-sizing: border-box;
        padding-right: 55px;
    }

    .toggle-password {
        position: absolute;
        right: 10px;
        top: 12px;

        background: transparent;
        border: none;
        color: #6b7280;

        padding: 8px;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .toggle-password:hover {
        background: #f3f4f6;
        color: #6336ff;
    }

    .toggle-password:focus-visible {
        outline: 2px solid #6336ff;
    }

    .toggle-password svg {
        width: 22px;
        height: 22px;
    }

    .toggle-password svg[hidden] {
        display: none;
    }

    .forgot-password {
        text-align: right;
        margin-bottom: 20px;
    }

    .forgot-password a {
        color: #6336ff;
        text-decoration: none;
    }

    .forgot-password a:hover {
        text-decoration: underline;
    }
</style>

<h2>Đăng nhập Mini LMS</h2>

<form method="post">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <!-- EMAIL -->
    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Nhập email của bạn"
        autocomplete="email"
        required
    >

    <!-- MAT KHAU -->
    <label for="password">Mật khẩu</label>

    <div class="password-wrapper">

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
        >

        <!-- NUT CON MAT -->
        <button
            type="button"
            id="togglePassword"
            class="toggle-password"
            aria-label="Hiện mật khẩu"
            aria-controls="password"
            aria-pressed="false"
        >

            <!-- CON MAT -->
            <svg
                id="eyeOpen"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
            >
                <path
                    d="M2 12s3.5-7 10-7
                       10 7 10 7-3.5 7-10 7
                       -10-7-10-7Z"
                />
                <circle cx="12" cy="12" r="3"/>
            </svg>

            <!-- CON MAT GACH CHEO -->
            <svg
                id="eyeClosed"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
                hidden
            >
                <path d="M3 3 21 21"/>
                <path
                    d="M10.5 5.1A10 10 0 0 1
                       12 5c6.5 0 10 7 10 7
                       a15 15 0 0 1-4 4.5"
                />
                <path
                    d="M6.2 6.2C3.5 8 2 12 2 12
                       s3.5 7 10 7
                       c1.5 0 2.9-.4 4.1-1"
                />
            </svg>

        </button>

    </div>

    <!-- QUEN MAT KHAU -->
    <div class="forgot-password">
        <a href="{{ url_for('password_reset.forgot_password') }}">
            Quên mật khẩu?
        </a>
    </div>

    <!-- DANG NHAP -->
    <button class="full" type="submit">
        Đăng nhập
    </button>

</form>

<p style="text-align: center; margin-top: 20px;">
    Chưa có tài khoản?
    <a href="{{ url_for('auth.register') }}">
        Đăng ký
    </a>
</p>

<!-- JAVASCRIPT HIEN / AN MAT KHAU -->
<script>
    const passwordInput =
        document.getElementById("password");

    const toggleButton =
        document.getElementById("togglePassword");

    const eyeOpen =
        document.getElementById("eyeOpen");

    const eyeClosed =
        document.getElementById("eyeClosed");

    toggleButton.addEventListener("click", function () {

        const isHidden =
            passwordInput.type === "password";

        if (isHidden) {
            passwordInput.type = "text";
            eyeOpen.hidden = true;
            eyeClosed.hidden = false;

            toggleButton.setAttribute(
                "aria-label", "Ẩn mật khẩu"
            );
        } else {
            passwordInput.type = "password";
            eyeOpen.hidden = false;
            eyeClosed.hidden = true;

            toggleButton.setAttribute(
                "aria-label", "Hiện mật khẩu"
            );
        }

        toggleButton.setAttribute(
            "aria-pressed",
            String(isHidden)
        );
    });
</script>

{% endblock %}
