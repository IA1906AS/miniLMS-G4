
{% extends "base.html" %}

{% block content %}
<h2>Đặt lại mật khẩu</h2>

<form method="post">
    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <label>Mật khẩu mới</label>
    <input type="password"
           name="password"
           minlength="8"
           autocomplete="new-password"
           required>

    <label>Nhập lại mật khẩu</label>
    <input type="password"
           name="confirm"
           minlength="8"
           autocomplete="new-password"
           required>

    <button type="submit" class="full">
        Cập nhật mật khẩu
    </button>
</form>
{% endblock %}
