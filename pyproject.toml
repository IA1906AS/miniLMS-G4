[project]
name = "my-project"
version = "0.1.0"
description = "miniLMS - minimal Flask Learning Management System"
readme = "README.md"
authors = [
    { name = "Tuan Anh", email = "Tuan Anh@DESKTOP-EH1EC7F" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.0,<6.0",
    "flask>=3.1,<4.0",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.8,<3.0",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "filelock>=4.2.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "virtualenv>=21.14.9",
]
