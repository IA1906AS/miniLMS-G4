
{% extends "base.html" %}

{% block title %}Đặt lại mật khẩu{% endblock %}

{% block content %}
<div class="home-layout">

    <section class="card">
        <h1>Quên mật khẩu</h1>

        <p class="sub">
            Nhập email đã đăng ký để yêu cầu đặt lại mật khẩu.
        </p>

        <form id="forgot-form">
            <label for="reset-email">Email</label>
            <input
                id="reset-email"
                name="email"
                type="email"
                placeholder="email@lms.test"
                autocomplete="email"
                required
            >

            <button type="submit">
                Gửi yêu cầu đặt lại mật khẩu
            </button>

            <div
                id="forgot-msg"
                class="msg"
                role="status"
                aria-live="polite"
            ></div>
        </form>
    </section>

    <section class="card">
        <h2>Xác nhận mật khẩu mới</h2>

        <p class="sub">
            Nhập token đặt lại mật khẩu và mật khẩu mới của bạn.
        </p>

        <form id="reset-form">
            <label for="reset-token">Token đặt lại mật khẩu</label>
            <input
                id="reset-token"
                name="token"
                type="text"
                placeholder="Dán token nhận được"
                autocomplete="off"
                required
            >

            <label for="reset-new">Mật khẩu mới</label>
            <input
                id="reset-new"
                name="password"
                type="password"
                placeholder="Nhập mật khẩu mới"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Đổi mật khẩu
            </button>

            <div
                id="confirm-msg"
                class="msg"
                role="status"
                aria-live="polite"
            ></div>
        </form>
    </section>

</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const forgotFormElement = document.getElementById("forgot-form");
        const resetFormElement = document.getElementById("reset-form");

        if (forgotFormElement) {
            forgotFormElement.addEventListener("submit", function (event) {
                event.preventDefault();

                if (typeof forgotForm === "function") {
                    forgotForm();
                }
            });
        }

        if (resetFormElement) {
            resetFormElement.addEventListener("submit", function (event) {
                event.preventDefault();

                if (typeof resetForm === "function") {
                    resetForm();
                }
            });
        }
    });
</script>
{% endblock %}
