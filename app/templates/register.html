```html
{% extends "base.html" %}

{% block title %}Đăng ký{% endblock %}

{% block content %}
<div class="home-layout">
    <section class="card">
        <h1>Tạo tài khoản</h1>

        <p class="sub">
            Đăng ký tài khoản miniLMS mới.
            Tài khoản đăng ký sẽ có vai trò STUDENT.
        </p>

        <form id="register-form">
            <label for="reg-email">Email</label>

            <input
                id="reg-email"
                name="email"
                type="email"
                placeholder="ten.ban@lms.test"
                autocomplete="email"
                required
            >

            <label for="reg-password">Mật khẩu</label>

            <input
                id="reg-password"
                name="password"
                type="password"
                placeholder="Nhập mật khẩu (ít nhất 8 ký tự)"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">Đăng ký</button>

            <div
                id="register-msg"
                class="msg"
                role="status"
                aria-live="polite"
            ></div>
        </form>

        <p class="sub">
            Đã có tài khoản?
            <a href="{{ url_for('pages.login_page') }}">Đăng nhập</a>
        </p>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("register-form");

    if (form) {
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (typeof registerForm === "function") {
                registerForm();
            }
        });
    }
});
</script>
{% endblock %}
