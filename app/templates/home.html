
{% extends "base.html" %}

{% block title %}Trang chủ{% endblock %}

{% block content %}
<div class="home-layout">

    <!-- Login -->
    <section class="card">
        <h1>Đăng nhập</h1>

        <p class="sub">
            Dùng tài khoản có trong <code>seed.json</code> của bài.
        </p>

        <form id="login-form">
            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                placeholder="email@lms.test"
                autocomplete="username"
                required
            >

            <label for="password">Mật khẩu</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="Mật khẩu"
                autocomplete="current-password"
                required
            >

            <button type="submit">Đăng nhập</button>

            <div
                id="login-msg"
                class="msg"
                role="status"
                aria-live="polite"
            ></div>
        </form>
    </section>

    <!-- Register -->
    <section class="card">
        <h2>Đăng ký tài khoản</h2>

        <p class="sub">
            Tài khoản tự đăng ký có vai trò STUDENT.
        </p>

        <form id="register-form">
            <label for="reg-email">Email</label>
            <input
                id="reg-email"
                name="email"
                type="email"
                placeholder="ten.ban@lms.test"
                autocomplete="email"
                required
            >

            <label for="reg-password">
                Mật khẩu (tối thiểu 8 ký tự)
            </label>
            <input
                id="reg-password"
                name="password"
                type="password"
                placeholder="Nhập mật khẩu"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="ghost">
                Tạo tài khoản
            </button>

            <div
                id="register-msg"
                class="msg"
                role="status"
                aria-live="polite"
            ></div>
        </form>
    </section>

</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const loginFormElement = document.getElementById("login-form");
        const registerFormElement = document.getElementById("register-form");

        if (loginFormElement) {
            loginFormElement.addEventListener("submit", function (event) {
                event.preventDefault();

                if (typeof loginForm === "function") {
                    loginForm();
                }
            });
        }

        if (registerFormElement) {
            registerFormElement.addEventListener("submit", function (event) {
                event.preventDefault();

                if (typeof registerForm === "function") {
                    registerForm();
                }
            });
        }
    });
</script>
{% endblock %}
