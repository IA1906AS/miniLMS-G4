
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}miniLMS{% endblock %} · miniLMS
    </title>

    <!-- CSS chính -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>

    <!-- ==================================
         HEADER
         ================================== -->
    <header>

        <!-- LOGO -->
        <div class="brand">
            <a
                href="{{ url_for('pages.home') }}"
                class="brand-link"
            >
                <span class="logo">LMS</span>
                <span>miniLMS</span>
            </a>
        </div>

        <!-- NAVIGATION -->
        <nav aria-label="Điều hướng chính">

            <!-- Luôn hiển thị -->
            <a href="{{ url_for('pages.home') }}">
                Trang chủ
            </a>

            <!-- CHƯA ĐĂNG NHẬP -->
            <a
                href="{{ url_for('pages.login_page') }}"
                class="guest-only"
            >
                Đăng nhập
            </a>

            <a
                href="{{ url_for('pages.register_page') }}"
                class="guest-only"
            >
                Đăng ký
            </a>

            <!-- ĐÃ ĐĂNG NHẬP -->
            <a
                href="{{ url_for('pages.account') }}"
                class="auth-only"
                hidden
            >
                Tài khoản
            </a>

            <a
                href="#"
                id="logout-link"
                class="auth-only"
                hidden
            >
                Đăng xuất
            </a>

        </nav>
    </header>

    <!-- ==================================
         MAIN CONTENT
         ================================== -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- ==================================
         FOOTER
         ================================== -->
    <footer>
        <p class="sub">
            &copy; 2026 miniLMS. All rights reserved.
        </p>
    </footer>

    <!-- ==================================
         JAVASCRIPT
         ================================== -->

    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>

    {% block scripts %}{% endblock %}

</body>
</html>
