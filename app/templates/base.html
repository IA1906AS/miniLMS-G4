
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}miniLMS{% endblock %} · miniLMS</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>
    <header>
        <div class="brand">
            <a href="/" class="brand-link">
                <span class="logo">LMS</span>
                <span>miniLMS</span>
            </a>
        </div>

       <nav>
    <a href="{{ url_for('pages.home') }}">Trang chủ</a>
    <a href="{{ url_for('pages.login_page') }}">Đăng nhập</a>
    <a href="{{ url_for('pages.register_page') }}">Đăng ký</a>
    <a href="{{ url_for('pages.account') }}">Tài khoản</a>
    <a href="#" id="logout-link">Đăng xuất</a>
       </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        miniLMS · Flask + JWT
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    {% block scripts %}{% endblock %}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const logoutLink = document.getElementById("logout-link");

            if (!logoutLink) {
                return;
            }

            logoutLink.addEventListener("click", function (event) {
                event.preventDefault();

                if (typeof logout === "function") {
                    logout();
                    return;
                }

                sessionStorage.removeItem("lms_token");
                window.location.href = "/";
            });
        });
    </script>
</body>
</html>
