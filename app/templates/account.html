
{% extends "base.html" %}

{% block title %}Trang tài khoản{% endblock %}

{% block content %}
<div class="home-layout">

    <!-- Account information -->
    <section class="card">
        <h1>Trang tài khoản</h1>

        <p class="sub">
            Xin chào! <strong id="who">…</strong>.
        </p>

        <dl>
            <dt>Mã người dùng</dt>
            <dd id="me-id">–</dd>

            <dt>Email</dt>
            <dd id="me-email">–</dd>

            <dt>Vai trò</dt>
            <dd id="me-role">–</dd>
        </dl>

        <div
            id="account-msg"
            class="msg"
            role="status"
            aria-live="polite"
        ></div>
    </section>

    <!-- Grades -->
    <section class="card">
        <h2>Điểm các môn</h2>

        <table>
            <thead>
                <tr>
                    <th>Môn</th>
                    <th>Sinh viên</th>
                    <th>Điểm</th>
                </tr>
            </thead>

            <tbody id="grades"></tbody>
        </table>
    </section>

    
</div>
{% endblock %}
