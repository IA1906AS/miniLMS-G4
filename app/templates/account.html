
{% extends "base.html" %}

{% block title %}Trang tài khoản{% endblock %}

{% block content %}
<div class="home-layout">

    <!-- Account information -->
    <section class="card">
        <h1>Trang tài khoản</h1>

        <p class="sub">
            Xin chào! <strong id="who">…</strong>.
        </p>

        <dl>
            <dt>Mã người dùng</dt>
            <dd id="me-id">–</dd>

            <dt>Email</dt>
            <dd id="me-email">–</dd>

            <dt>Vai trò</dt>
            <dd id="me-role">–</dd>
        </dl>

        <div
            id="account-msg"
            class="msg"
            role="status"
            aria-live="polite"
        ></div>
    </section>

    <!-- Grades -->
    <section class="card">
        <h2>Điểm các môn</h2>

        <table>
            <thead>
                <tr>
                    <th>Môn</th>
                    <th>Sinh viên</th>
                    <th>Điểm</th>
                </tr>
            </thead>

            <tbody id="grades"></tbody>
        </table>
    </section>

    <!-- Grade editor (instructors only) -->
    <section class="card" id="grade-editor" hidden>
        <h2>Quản lý điểm</h2>

        <label for="edit-course">Môn học</label>
        <select id="edit-course"></select>

        <label for="edit-student">Sinh viên</label>
        <select id="edit-student"></select>

        <label for="edit-score">Điểm (0–10)</label>
        <input
            type="number"
            id="edit-score"
            min="0"
            max="10"
            step="0.5"
            placeholder="Nhập điểm mới"
        >

        <button type="button" id="edit-grade-button">
            Cập nhật điểm
        </button>

        <div
            id="edit-grade-msg"
            class="msg"
            role="status"
            aria-live="polite"
        ></div>
    </section>

    
</div>
{% endblock %}
