{% extends "base.html" %}

{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<div class="home-layout">
    <section class="card">
        <h1>Đổi mật khẩu</h1>
        <p class="sub">Nhập mật khẩu hiện tại để đặt mật khẩu mới. Sau khi đổi, bạn cần đăng nhập lại.</p>
        <form id="change-password-form" hidden>
            <label for="current-password">Mật khẩu hiện tại</label>
            <input id="current-password" type="password" autocomplete="current-password" required>
            <label for="new-password">Mật khẩu mới</label>
            <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
            <label for="confirm-password">Nhập lại mật khẩu mới</label>
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
            <button id="change-password-button" type="submit">Đổi mật khẩu</button>
        </form>
        <div id="change-password-msg" class="msg" role="status" aria-live="polite"></div>
        <a id="change-password-login" href="/login" hidden>Đăng nhập lại</a>
        <p><a href="{{ url_for('pages.account') }}">Quay lại trang tài khoản</a></p>
    </section>
</div>
{% endblock %}
