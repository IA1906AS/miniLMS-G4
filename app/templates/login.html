
{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<section class="card login-card">
    <div class="brand">
        <span class="logo">LMS</span>
        <span>miniLMS</span>
    </div>

    <h1>Chào mừng trở lại</h1>

    <p class="sub">
        Đăng nhập vào hệ thống quản lý học tập MiniLMS.
    </p>

    <form id="login-form" onsubmit="loginForm(event)">
        <label for="email">Email</label>
        <input
            id="email"
            name="email"
            type="email"
            placeholder="email@lms.test"
            autocomplete="username"
            required
        >

        <label for="password">Mật khẩu</label>
        <input
            id="password"
            name="password"
            type="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
        >

        <button id="login-button" type="submit">
            Đăng nhập
        </button>

        <div
            id="login-msg"
            class="msg"
            role="status"
            aria-live="polite"
        ></div>
    </form>

    <p class="sub">
        Chưa có tài khoản?
        <a href="/register">Đăng ký ngay</a>
    </p>

    <p class="sub">
        <a href="/">← Quay lại trang chủ</a>
    </p>
</section>
{% endblock %}
