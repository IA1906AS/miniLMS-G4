{% extends "base.html" %}
{% block title %}Điểm số{% endblock %}
{% block content %}
<div class="home-layout">
    <section class="card">
        <p class="eyebrow">KẾT QUẢ HỌC TẬP</p>
        <h1 id="grades-page-title">Điểm số</h1>
        <p id="grades-page-description" class="sub">Đang tải thông tin điểm…</p>
        <div id="grades-page-msg" class="msg" role="status" aria-live="polite"></div>
    </section>
    <div id="grades-content" class="home-layout" hidden>
    <!-- Grades -->
    <section class="card" id="grades-section">
        <h2 id="grades-heading">Điểm các môn</h2>

        <table>
            <thead>
                <tr>
                    <th>Môn</th>
                    <th>Sinh viên</th>
                    <th>Điểm</th>
                </tr>
            </thead>

            <tbody id="grades"></tbody>
        </table>
    </section>

    <!-- Grade editor (instructors only) -->
    <section class="card" id="grade-editor" hidden>
        <h2>Quản lý điểm</h2>

        <label for="edit-course">Môn học</label>
        <select id="edit-course"></select>

        <label for="edit-student">Sinh viên</label>
        <select id="edit-student"></select>

        <label for="edit-score">Điểm (0–10)</label>
        <input
            type="number"
            id="edit-score"
            min="0"
            max="10"
            step="0.5"
            placeholder="Nhập điểm mới"
        >

        <button type="button" id="edit-grade-button">
            Cập nhật điểm
        </button>

        <div
            id="edit-grade-msg"
            class="msg"
            role="status"
            aria-live="polite"
        ></div>
    </section>
    </div>
</div>
{% endblock %}
